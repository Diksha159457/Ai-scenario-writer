[project]
name = "ai-scenario-writer"
version = "2.0.0"
description = "LLM workplace-scenario generator with schema-enforced output, self-correcting retries and a reliability eval."
requires-python = ">=3.10"
dependencies = ["groq>=0.31.0", "pydantic>=2.7.0"]

[project.optional-dependencies]
ui = ["streamlit>=1.45.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["app.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
per-file-ignores = { "src/prompt_builder.py" = ["E501"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
